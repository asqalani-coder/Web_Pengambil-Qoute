<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Generator - Day 1</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      text-align: center;
    }
    p { font-size: 1.1rem; margin-bottom: 12px; line-height: 1.5; }
    small { color: #00adb5; font-weight: bold; }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background-color: #00adb5;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }
    button:active { opacity: 0.8; }
  </style>
</head>
<body>

  <div class="card">
    <p id="quote-text">Mengambil quote...</p>
    <small id="quote-author">-</small>
    <br>
    <button id="btn-quote">Dapatkan Quote Baru </button>
    <button id="btn-clipboard">Salin Quote</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
